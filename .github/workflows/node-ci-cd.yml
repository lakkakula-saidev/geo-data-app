# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Geo data app CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    
    services:
      json-server:
        image: lsaidev/my-json-server:v2
        credentials:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl http://localhost:3000 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          JSON_SERVER_DATA: /data/db.json
        volumes:
          - ./db.json:/data/db.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Wait for json-server to be ready
        run: |
          echo "Waiting for json-server..."
          until curl -s http://localhost:3000; do sleep 1; done
          echo "json-server is up!"

      - name: Run tests
        run: npm test

      - name: Build the app
        run: npm run build
