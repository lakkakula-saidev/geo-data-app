<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Maps Logo</title>
  <rect rx="8" width="180" height="48" fill="#0F172A"/>
  <g transform="translate(16 8)">
    <!-- Stylized map pin -->
    <g>
      <circle cx="16" cy="16" r="12" fill="#1D4ED8"/>
      <circle cx="16" cy="16" r="6" fill="#93C5FD"/>
      <path d="M16 30c4.5-6 9-9.6 9-14a9 9 0 1 0-18 0c0 4.4 4.5 8 9 14z" fill="url(#grad)" opacity="0.9"/>
    </g>
    <!-- Text -->
    <text x="48" y="20" font-family="Inter, system-ui, Arial, sans-serif" font-size="20" font-weight="600" fill="#F1F5F9" letter-spacing="1">
      MAPS
